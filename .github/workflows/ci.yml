name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 语法检查（sh -n / py_compile）
        run: |
          sh -n install.sh validate-memory.sh tests/installer.test.sh tests/install.test.sh tests/build.test.sh tests/spec-migrate.test.sh tests/skill-sync.test.sh tests/mcp.test.sh tests/doc-gate.test.sh
          python3 -m py_compile memory-build spec-migrate memory-recall domain-check doc-gate governance-eval
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck install.sh validate-memory.sh tests/installer.test.sh tests/install.test.sh tests/build.test.sh tests/spec-migrate.test.sh tests/skill-sync.test.sh tests/mcp.test.sh tests/doc-gate.test.sh
      - name: 安装器测试
        run: sh tests/install.test.sh
      - name: 安装 zvec（语义检索层/安装器测试依赖）
        run: pip install --user --break-system-packages zvec
      - name: 安装器生命周期测试（事务/崩溃恢复/存量迁移/--svn 治理）
        run: sh tests/installer.test.sh
      - name: 生成器测试
        run: sh tests/build.test.sh
      - name: Spec Kit 迁移测试
        run: sh tests/spec-migrate.test.sh
      - name: 技能副本一致性
        run: sh tests/skill-sync.test.sh
      - name: MCP 协议测试
        run: sh tests/mcp.test.sh
      - name: 文档门禁测试（doc-gate 硬校验/判定/冻结 + governance-eval）
        run: sh tests/doc-gate.test.sh
      - name: Windows 可导入性守卫（AST：fcntl/msvcrt/O_NOFOLLOW 隔离在 platform/）
        run: sh tests/import-guard.test.sh

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 全模块可导入（fcntl 已隔离在 platform/posix_fs）
        run: |
          python -m py_compile installer/*.py installer/platform/*.py doc-gate governance-eval domain-check memory-build memory-recall spec-migrate agent-engineering-mcp
          python -c "import sys; sys.path.insert(0, '.'); import installer.install, installer.transaction, installer.uninstall, installer.zvec, installer.manifest, installer.registry, installer.doctor, installer.legacy, installer.preflight; print('installer modules import OK on Windows')"
      - name: 平台无关工具测试（doc-gate + governance-eval + import 守卫）
        shell: bash
        run: |
          python doc-gate check --help >/dev/null
          echo "governance-eval smoke" | python governance-eval . >/dev/null 2>&1 || true
          echo "doc-gate CLI OK on Windows"

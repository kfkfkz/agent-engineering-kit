name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 语法检查（sh -n / py_compile）
        run: |
          sh -n install.sh validate-memory.sh tests/installer.test.sh tests/install.test.sh tests/build.test.sh tests/spec-migrate.test.sh tests/skill-sync.test.sh tests/mcp.test.sh tests/doc-gate.test.sh tests/route-eval.test.sh tests/benchmark.test.sh
          python3 -m py_compile memory-build spec-migrate memory-recall domain-check doc-gate governance-eval route-eval
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck install.sh validate-memory.sh tests/installer.test.sh tests/install.test.sh tests/build.test.sh tests/spec-migrate.test.sh tests/skill-sync.test.sh tests/mcp.test.sh tests/doc-gate.test.sh tests/route-eval.test.sh tests/benchmark.test.sh
      - name: 安装器测试
        run: |
          set +e
          output="$(sh tests/install.test.sh 2>&1)"
          rc=$?
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            detail="$(printf '%s\n' "$output" | grep '^✗' | tail -n 1)"
            [ -n "$detail" ] || detail="$(printf '%s\n' "$output" | tail -n 1)"
            printf '::error title=install.test.sh::%s\n' "$detail"
            exit "$rc"
          fi
      - name: 安装 zvec（语义检索层/安装器测试依赖）
        run: pip install --user --break-system-packages zvec
      - name: 安装器生命周期测试（事务/崩溃恢复/存量迁移/--svn 治理）
        run: sh tests/installer.test.sh
      - name: 生成器测试
        run: sh tests/build.test.sh
      - name: Spec Kit 迁移测试
        run: sh tests/spec-migrate.test.sh
      - name: 技能副本一致性
        run: sh tests/skill-sync.test.sh
      - name: MCP 协议测试
        run: sh tests/mcp.test.sh
      - name: 文档门禁测试（doc-gate 硬校验/判定/冻结 + governance-eval）
        run: sh tests/doc-gate.test.sh
      - name: 自适应任务路由测试（Route Card / 治理覆盖 / 范围漂移）
        run: sh tests/route-eval.test.sh
      - name: Benchmark 评测器回归测试
        run: sh tests/benchmark.test.sh
      - name: Windows 可导入性守卫（AST：fcntl/msvcrt/O_NOFOLLOW 隔离在 platform/）
        run: sh tests/import-guard.test.sh
      - name: archify 真实执行（安装产物 doctor + validate + deliver）
        run: |
          T=$(mktemp -d)
          python3 -m installer "$T" >/dev/null
          A="$T/.claude/skills/archify"
          test -f "$A/bin/archify.mjs"
          node "$A/bin/archify.mjs" doctor
          node "$A/bin/archify.mjs" validate workflow vendor/archify/examples/agent-tool-call.workflow.json --json | python3 -c "
          import json,sys; d=json.load(sys.stdin); assert d.get('ok'), d.get('error')"
          node "$A/bin/archify.mjs" deliver workflow vendor/archify/examples/agent-tool-call.workflow.json "$T/out.html" | grep -q "delivered"

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows Python 源码编译
        run: |
          python -m compileall -q installer
          python -m py_compile doc-gate governance-eval route-eval domain-check memory-build memory-recall spec-migrate agent-engineering-mcp
      - name: 全模块可导入（fcntl 已隔离在 platform/posix_fs）
        shell: pwsh
        run: |
          $modules = @(
            "installer.install", "installer.transaction", "installer.uninstall",
            "installer.zvec", "installer.manifest", "installer.registry",
            "installer.doctor", "installer.legacy", "installer.preflight"
          )
          foreach ($module in $modules) {
            $output = python -c "import importlib; importlib.import_module('$module')" 2>&1
            if ($LASTEXITCODE -ne 0) {
              $rc = $LASTEXITCODE
              $detail = ($output | Select-Object -Last 1).ToString().Replace("::", ":")
              Write-Output "::error title=Windows module import failed::$module — $detail"
              $output | ForEach-Object { Write-Output $_ }
              exit $rc
            }
          }
          Write-Output "installer modules import OK on Windows"
      - name: 原生 Windows copy 生命周期（install / update / doctor / uninstall）
        shell: pwsh
        run: |
          function Invoke-InstallerPhase {
            param([string]$Phase, [string[]]$InstallerArgs)
            $output = & python -m installer @InstallerArgs 2>&1
            $rc = $LASTEXITCODE
            $output | ForEach-Object { Write-Output $_ }
            if ($rc -eq 0) { return }

            $failures = @($output | Where-Object { $_.ToString().StartsWith("✗") })
            if ($failures.Count -gt 0) {
              $detail = ($failures | ForEach-Object { $_.ToString() }) -join " | "
            } else {
              $detail = ($output | Select-Object -Last 1).ToString()
            }
            $detail = $detail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A").Replace("::", ":")
            Write-Output "::error title=Windows copy lifecycle::$Phase failed ($rc) — $detail"
            exit $rc
          }

          $repo = Join-Path $env:RUNNER_TEMP "aek-windows-repo"
          $codex = Join-Path $env:RUNNER_TEMP "aek-windows-workspace"
          New-Item -ItemType Directory -Force -Path $repo, $codex | Out-Null
          Invoke-InstallerPhase "install" @("--codex-root", $codex, "--link-strategy", "copy", $repo)
          $copy = Join-Path $codex ".agents/skills/tdd/SKILL.md"
          if (-not (Test-Path -LiteralPath $copy -PathType Leaf)) {
            Write-Output "::error title=Windows copy lifecycle::copy strategy did not expose tdd skill"
            exit 1
          }
          $item = Get-Item -LiteralPath $copy
          if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            Write-Output "::error title=Windows copy lifecycle::copy strategy unexpectedly created a reparse point"
            exit 1
          }
          Invoke-InstallerPhase "update" @("--update", "--codex-root", $codex, "--link-strategy", "copy", $repo)
          Invoke-InstallerPhase "doctor" @("--doctor", "--codex-root", $codex, $repo)
          Invoke-InstallerPhase "uninstall" @("--uninstall", "--codex-root", $codex, $repo)
          if (Test-Path -LiteralPath $copy) {
            Write-Output "::error title=Windows copy lifecycle::uninstall left managed copy behind"
            exit 1
          }
      - name: Windows smoke — document and routing CLIs
        shell: bash
        run: |
          export PYTHONIOENCODING=cp1252
          python doc-gate --help >/dev/null
          printf 'strict\n' > /tmp/gov-marker
          echo "diff --git a/x b/x" | python governance-eval . && echo "governance-eval OK on Windows"
          python route-eval --init | python -c "import json,sys; assert json.load(sys.stdin)['version'] == 1"
      - name: Windows smoke — spec-migrate
        shell: bash
        run: PYTHONIOENCODING=cp1252 python spec-migrate --help >/dev/null
      - name: Windows smoke — memory-recall
        shell: bash
        run: |
          T="$(mktemp -d)"
          mkdir -p "$T/docs/memory/pitfalls"
          printf '# Windows 中文语料\n' > "$T/docs/memory/pitfalls/中文条目.md"
          set +e
          output="$(PYTHONIOENCODING=cp1252 python memory-recall --list "$T" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            detail="$(printf '%s' "$output" | tr '\r\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Windows memory-recall smoke::$detail"
            exit "$rc"
          fi
      - name: Windows smoke — memory-build
        shell: bash
        run: |
          T="$(mktemp -d)"
          mkdir -p "$T/docs/memory/pitfalls"
          printf '# Windows 中文语料\n' > "$T/docs/memory/pitfalls/中文条目.md"
          printf '' | PYTHONIOENCODING=cp1252 python memory-build --files "$T" >/dev/null
      - name: Windows smoke — domain-check expected error
        shell: bash
        run: |
          export PYTHONIOENCODING=cp1252
          if output="$(python domain-check . 2>&1)"; then
            echo "domain-check unexpectedly found a domain map" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -q '未找到'
      - name: Windows smoke — MCP UTF-8 JSON-RPC
        shell: bash
        run: |
          export PYTHONIOENCODING=cp1252
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | python agent-engineering-mcp \
            | PYTHONIOENCODING=utf-8 python -c "import json,sys; rows=[json.loads(x) for x in sys.stdin]; assert len(rows) == 2 and len(rows[1]['result']['tools']) == 4"
